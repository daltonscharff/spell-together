services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "${APP_PORT}:3000"
    develop:
      watch:
        - action: sync
          path: .
          target: /app
        - action: rebuild
          path: package*.json
        - action: rebuild
          path: Dockerfile.web
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL}

  db:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]

  cron:
    build:
      context: .
      dockerfile: Dockerfile.cron
    volumes:
      - cron_logs:/var/log/cron
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - TZ=${CRON_TIMEZONE}
      - CRON_SCHEDULE=${CRON_SCHEDULE}
      - CRON_MAX_PUZZLES=${CRON_MAX_PUZZLES}
      - CRON_MAX_UNUSED_ROOM_DAYS=${CRON_MAX_UNUSED_ROOM_DAYS}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  cron_logs:
